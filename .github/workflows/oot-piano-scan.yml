name: Check OoT Piano core download

on:
  push:
    branches: [oot-piano-test]

permissions:
  actions: read
  contents: read

jobs:
  scan:
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: 34952077047
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: oot-piano-retroarch-windows-x64
          path: downloaded-core
      - name: Check DLL and scan with Microsoft Defender
        shell: pwsh
        run: |
          $dll = Join-Path $PWD 'downloaded-core/oot_piano_libretro.dll'
          if (-not (Test-Path $dll)) { throw 'Core DLL missing from artifact' }
          $hash = (Get-FileHash $dll -Algorithm SHA256).Hash
          Write-Output "DLL SHA256: $hash"
          $status = Get-MpComputerStatus -ErrorAction Stop
          if (-not $status.AntivirusEnabled -or -not $status.RealTimeProtectionEnabled) {
            throw 'Microsoft Defender is not enabled on the build runner'
          }
          Write-Output "Defender signature version: $($status.AntivirusSignatureVersion)"
          Start-MpScan -ScanType CustomScan -ScanPath $dll -ErrorAction Stop
          if (-not (Test-Path $dll)) { throw 'Defender removed the DLL during the scan' }
          $detections = @(Get-MpThreatDetection -ErrorAction Stop)
          $pathMatches = @($detections | Where-Object { $_.Resources -match 'oot_piano_libretro.dll' })
          if ($pathMatches.Count -gt 0) { throw 'Defender reported a detection for the DLL' }
          Write-Output 'Defender scan completed without a detection for this DLL'
