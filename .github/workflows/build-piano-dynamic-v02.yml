name: Build OoT Piano Dynamic v0.2

on:
  push:
    branches: [wav-wrapper]
    paths:
      - 'custom/piano_dynamic/oot_piano_dynamic_wrapper_v02.c'
      - 'custom/piano_dynamic/mupen64plus_oot_piano_dynamic_v02_libretro.info'
      - '.github/workflows/build-piano-dynamic-v02.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64

      - name: Build dynamic v0.2 wrapper DLL
        run: |
          x86_64-w64-mingw32-gcc \
            -std=c11 -O2 -Wall -Wextra \
            -shared -static-libgcc \
            -Ilibretro-common/include \
            custom/piano_dynamic/oot_piano_dynamic_wrapper_v02.c \
            -o mupen64plus_oot_piano_dynamic_v02_libretro.dll

          cp custom/piano_dynamic/mupen64plus_oot_piano_dynamic_v02_libretro.info .

          file mupen64plus_oot_piano_dynamic_v02_libretro.dll
          x86_64-w64-mingw32-objdump -p mupen64plus_oot_piano_dynamic_v02_libretro.dll \
            | sed -n '/DLL Name:/p' | tee dependencies.txt

          for sym in \
            retro_api_version retro_init retro_deinit retro_get_system_info \
            retro_get_system_av_info retro_set_environment retro_set_video_refresh \
            retro_set_audio_sample retro_set_audio_sample_batch retro_set_input_poll \
            retro_set_input_state retro_set_controller_port_device retro_reset retro_run \
            retro_serialize_size retro_serialize retro_unserialize retro_cheat_reset \
            retro_cheat_set retro_load_game retro_load_game_special retro_unload_game \
            retro_get_region retro_get_memory_data retro_get_memory_size; do
              x86_64-w64-mingw32-nm -g mupen64plus_oot_piano_dynamic_v02_libretro.dll | grep -q " $sym$" \
                || { echo "Missing export: $sym"; exit 1; }
          done

          sha256sum mupen64plus_oot_piano_dynamic_v02_libretro.dll > SHA256.txt

      - name: Upload dynamic v0.2 package
        uses: actions/upload-artifact@v4
        with:
          name: oot-piano-dynamic-v02-win64
          path: |
            mupen64plus_oot_piano_dynamic_v02_libretro.dll
            mupen64plus_oot_piano_dynamic_v02_libretro.info
            dependencies.txt
            SHA256.txt
